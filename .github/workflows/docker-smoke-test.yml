name: Docker Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t weather-api:smoke .

      - name: Start container
        run: |
          docker run -d --name weather-smoke -p 8000:8000 weather-api:smoke
          # Wait for the server to be ready
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/10)"
            sleep 2
          done

      - name: Test /health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          if [ "$STATUS" != "200" ]; then
            echo "::error::/health returned $STATUS, expected 200"
            exit 1
          fi
          echo "/health returned 200 ✓"

      - name: Test /weather/{city} endpoint
        run: |
          BODY=$(curl -sf http://localhost:8000/weather/London)
          echo "Response: $BODY"

          # Validate required fields exist in response
          echo "$BODY" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['city'] == 'London', f'Expected London, got {data[\"city\"]}'
          assert 'temperature_c' in data
          assert 'humidity_pct' in data
          assert 'condition' in data
          print('/weather/London response valid ✓')
          "

      - name: Test unknown city returns 404
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/weather/Atlantis)
          if [ "$STATUS" != "404" ]; then
            echo "::error::/weather/Atlantis returned $STATUS, expected 404"
            exit 1
          fi
          echo "/weather/Atlantis returned 404 ✓"

      - name: Stop container
        if: always()
        run: docker rm -f weather-smoke || true
